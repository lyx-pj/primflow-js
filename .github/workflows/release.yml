name: 发布 npm 包
run-name: 发布 ${{ github.ref_name }} 到 npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max

jobs:
  publish:
    if: github.ref_type == 'tag' && github.event.created == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 确认版本提交来自 main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'

      - run: pnpm install --frozen-lockfile

      - name: 校验发布 tag 与版本快照
        run: pnpm exec tsx scripts/validate-release.ts
        env:
          RELEASE_REF: ${{ github.ref_name }}

      - name: 构建库并验证包边界
        run: pnpm build

      - name: 使用 npm Trusted Publishing 发布
        # 递归发布会跳过已上传的版本，同一个 tag 可以安全重跑。
        run: >-
          pnpm -r --filter './packages/*' --fail-if-no-match publish
          --access public --registry https://registry.npmjs.org/
          --publish-wait-timeout 120000

  pages:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      release_tag: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
