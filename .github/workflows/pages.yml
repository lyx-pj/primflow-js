name: 部署示例到 GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_type == 'tag' && github.event.deleted != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'

      - run: pnpm install --frozen-lockfile

      - name: 校验发布 tag 与版本快照
        run: pnpm exec tsx scripts/validate-release.ts
        env:
          RELEASE_REF: ${{ github.ref_name }}

      - name: 构建库并验证包边界
        run: pnpm build

      - name: 构建示例
        run: pnpm --filter primflow-react-example build --base=/primflow-js/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/primflow-react/dist

      - name: 发布页面
        id: deployment
        uses: actions/deploy-pages@v5
